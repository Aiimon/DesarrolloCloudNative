spring.application.name=TiendaLevelUp

# ==========================================
# Configuración de Base de Datos (Oracle Cloud)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# IMPORTANTE: Cambia la ruta por la ubicación real del Wallet en tu EC2 (Linux)
spring.datasource.url=jdbc:oracle:thin:@tiendalevelup_low?TNS_ADMIN=/home/ubuntu/Wallet_tiendalevelup
spring.datasource.username=ADMIN
spring.datasource.password=Tiendalevelup1.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialecto e impresión de SQL
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# Configuración de RabbitMQ (Cluster HA + DLQ + Retry)
# ==========================================
# Reemplazamos host/port por addresses para incluir ambos nodos del cluster
spring.rabbitmq.addresses=localhost:5672,localhost:5673

# Credenciales configuradas en tu docker-compose.yml
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Modo de confirmación manual y fair dispatch
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Configuración de Reintentos (Exponential Backoff)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3

# ==========================================
# Servidor y Documentación Swagger
# ==========================================
server.port=8082

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Configuración de Apache Kafka & Kafka Streams
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Consumidor
spring.kafka.consumer.group-id=level-up-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Streams
spring.kafka.streams.application-id=tienda-levelup-streams
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.springframework.kafka.support.serializer.JsonSerde
spring.kafka.streams.properties.spring.json.trusted.packages=*
